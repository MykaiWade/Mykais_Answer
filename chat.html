<!DOCTYPE html>
<!-- Tells the browser this is a modern HTML page. Always the first line. -->
<html lang="en">
<head>
    <!-- HEAD = setup info that visitors don't see directly. -->

    <!-- Lets letters like é and symbols display correctly. Leave this alone. -->
    <meta charset="UTF-8">

    <!-- Makes the page fit phone screens. Leave this alone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- The text on the browser tab. CHANGE: edit the word between the tags. -->
    <title>Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- BODY = everything visitors see, top to bottom. -->

    <!-- The big heading. CHANGE: edit the text between the tags. -->
    <h1>Chat</h1>

    <!-- Empty spot. The script fills it with "About: [question] | [question]". -->
    <div id="topic"></div>

    <!-- Empty white box. The script adds a bubble here for each message. -->
    <div id="messages"></div>

    <!-- The typing row. It's a form so pressing Enter sends the message too. -->
    <form id="sendRow">
        <!-- maxlength="500" = most characters in one message (match MAX_MESSAGE in server.py).
             placeholder = the gray hint text. CHANGE: edit it.
             autocomplete="off" stops the browser from suggesting old messages. -->
        <input type="text" id="text" maxlength="500" placeholder="Type a message" autocomplete="off">
        <button type="submit">Send</button>
    </form>

    <!-- A link to the home page. href must match the file name exactly. -->
    <p><a href="index.html">Back to Home</a></p>


    <!-- <Optional video call button. type="button" keeps it from sending the chat form. CHANGE: edit the text between the tags.
    
    <button type="button" id="videoBtn">Start video call</button>

         This live status line tells people what the call is doing or why it could not start. 
  
         <p id="videoStatus" role="status">Video calls are available in matched chat rooms.</p>
    
         This container places your preview and the other person's video together. -->

    <!-- <div id="callVideos" class="call-videos">
         Your camera preview; muted prevents hearing your own microphone through the speakers. -->
        
         <video id="localVideo" autoplay muted playsinline hidden></video>
       
         <!-- The other person's camera and microphone arrive through this video element. -->
        
        <video id="remoteVideo" autoplay playsinline hidden></video>
    </div>
  
    <!-- The other person sees this button after receiving a call offer. -->
   
    <button type="button" id="answerVideoCall" hidden>Answer call</button>
   
    <!-- This button declines an incoming call or ends an active call. -->
  
    <button type="button" id="endVideoCall" hidden>End call</button>
