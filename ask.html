<!DOCTYPE html>
<!-- Tells the browser this is a modern HTML page. Always the first line. -->
<html lang="en">
<!-- lang="en" = the page is in English. Change it (like "es") if you switch languages. -->


<head>
    <!-- HEAD = setup info that visitors don't see directly. -->
 
    <!-- Lets letters like é and symbols display correctly. Leave this alone. -->
    <meta charset="UTF-8">
 
    <!-- Makes the page fit phone screens instead of looking zoomed out. Leave this alone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <!-- The text on the browser tab. CHANGE: edit the word between the tags. -->
    <title>Ask</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <!-- BODY = everything visitors see, top to bottom. -->
 
    <!-- The big heading. CHANGE: edit the text between the tags. -->
    <h1>Ask a Question</h1>

    <!-- Profile name is public, but this site does not verify identity yet. -->
    <section class="profile-panel">
        <h2>Account</h2>
        <p>Your name is public. Your email is only for signing in and is not verified.</p>
        <p>There is no password reset yet. Save your password somewhere safe.</p>
        <p id="profileStatus" role="status">Loading profile...</p>
        <form id="registerForm">
            <div class="row">
                <label for="realName">Real name:</label>
                <input type="text" id="realName" maxlength="100" autocomplete="name" required>
            </div>
            <div class="row">
                <label for="registerEmail">Email:</label>
                <input type="email" id="registerEmail" maxlength="254" autocomplete="email" required>
            </div>
            <div class="row">
                <label for="registerPassword">Password:</label>
                <input type="password" id="registerPassword" minlength="12" maxlength="128" autocomplete="new-password" required>
            </div>
            <button type="submit">Create account</button>
            <button type="button" id="showLogin">Already have an account? Sign in</button>
        </form>
        <form id="loginForm" hidden>
            <div class="row">
                <label for="loginEmail">Email:</label>
                <input type="email" id="loginEmail" maxlength="254" autocomplete="email" required>
            </div>
            <div class="row">
                <label for="loginPassword">Password:</label>
                <input type="password" id="loginPassword" maxlength="128" autocomplete="current-password" required>
            </div>
            <button type="submit">Sign in</button>
            <button type="button" id="showRegister">Create a new account</button>
        </form>
        <button type="button" id="logoutButton" hidden>Sign out</button>
    </section>
 
    <!-- An empty spot for "New reply" cards. The script at the bottom fills it in if someone replied.
         id="inbox" is its name so the script can find it. -->
    <div id="inbox"></div>
 
    <!-- The question form. ask.js reads these fields when Submit is clicked. -->
    <form id="askForm">
 
        <!-- Row 1: the Question box. -->
        <div class="row">
            <!-- for="question" connects the label to the box, so clicking the word focuses the box. -->
            <label for="question">Question:</label>
            <!-- type="text" = one line. maxlength="200" = most characters allowed (match MAX_QUESTION in server.py).
                 required = the browser blocks Submit if this is empty. -->
            <input type="text" id="question" maxlength="200" required>
        </div>
 
        <!-- Row 2: the Description box (optional). -->
        <div class="row">
            <label for="description">Description:</label>
            <!-- textarea = a multi-line box. maxlength should match MAX_DESCRIPTION in server.py.
                 CHANGE: add a "required" before the ">" to make this box mandatory too. -->
            <textarea id="description" maxlength="1000"></textarea>
        </div>
       
<!-- Row 3: the Major badge menu. The script fills it from badges.txt. -->
        <div class="row">
            <label for="major">Major badge:</label>
            <!-- The first option is the starting text. CHANGE: the wording. -->
            <select id="major">
                <option value="">Choose a major badge</option>
            </select>
        </div>
 
        <!-- Row 4: the Minor badge menu. It stays invisible until a major badge is picked. -->
        <div class="row" id="minorRow" style="display: none;">
            <label for="minor">Minor badges:</label>
            <select id="minor"></select>
        </div>
 
        <!-- Picked minor badges show up here as buttons. Click one to remove it. -->
        <div id="picked"></div>
 
        <!-- The Submit button. type="submit" makes it send the form. CHANGE: edit the word "Submit". -->
        <button type="submit">Submit</button>
    </form>
 
    <!-- An empty spot where matches (or the "saved" message) appear after Submit. -->
    <div id="result"></div>
 
    <!-- A link to the home page. href must match the file name exactly. -->
    <p><a href="index.html">Back to Home</a></p>
 
    <script src="profile.js"></script>
    <!-- Loads the badge menus before ask.js uses them. -->
    <script src="badges.js"></script>
    <!-- Loads the submit and match code. -->
    <script src="ask.js"></script>

</body>
</html>
