<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Makes the page fit phone screens; leave this line alone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Text shown on the browser tab -->
    <title>Welcome</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <!-- Big heading and the question that tells visitors what to do -->
    <h1>Welcome</h1>
    <p>What would you like to do?</p>

    <!-- Card 1: the public question form. Opens ask.html -->
    <a class="card" href="ask.html">
        <strong>Ask a question</strong>
        <span>Send in a question with a description.</span>
    </a>

    <!-- Card 2: opens the public question rooms on ask-mykai.html. -->
    <a class="card" href="ask-mykai.html">
        <strong>Ask Mykai</strong>
        <!-- Describes the room creation, joining, and invitation features. -->
        <span>Start or join public question rooms and share an invite link.</span>
    </a>

    <!-- Card 3: opens about.html, which must also exist or visitors get a 404 -->
    <a class="card" href="about.html">
        <strong>About</strong>
        <span>Learn what this site is for.</span>

            <!-- Card 4: also opens to chat.html so you don;t have to go through ask.html -->
    <a class="card" href="chat.html">
        <strong>Chat</strong>
        <span>Have a conversation with other users.</span>
    </a>
</body>
</html>
