<!-- This would be used to display the user's the profile, or for now as a test profile when doing beta testing-->
<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <!-- Makes the page fit phone screens; leave this line alone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Text shown on the browser tab -->
    <title>User Profile</title>
    <link rel="stylesheet" href="profile.css">
    <script src="profile1.js" defer></script>
    </head>
    <body>
        <header class="profile-header">
            <a href="index.html" class="home-button">← Home</a>
        </header>
    
        <!--Loading animation when retrieving information-->
        <div id="profileLoading" class="profile-loading"
            role="status" aria-live="polite">
            <div class="loader"></div>
            <h2>Artey is finding your canvas...</h2>
            <p id="bio">Artey is trying to find your canvas...</p>
        </div>
        
        <!--Profile Information-->
        <main id="profileContent" class="profile-container" hidden>
            <section class="profile-card">
                <div class="profile-avatar" aria-hidden="true">A</div>

                <h1 id="username">Artey is finding your canvas...</h1>

                <div class="profile-details">
                    <p> 
                        <strong>User ID:</strong> 
                        <span id="userID">Loading...</span>
                    </p>

                    <p> 
                        <strong>Name:</strong> 
                        <span id="displayName">Loading...</span>
                    </p>

                    <div class="profile-bio">
                        <strong>Bio:</strong> 
                        <p id="bio">Artey is still retrieving your infor</p>
                    </div>
                </div>
            </section>
        </main>
        <!---
        <h1 id="username">Artey is finding your canvas...</h1>

        <p> User ID: <span id="userID"></span></p>
        <p> Name: <span id="displayName"></span></p>
        <p>Bio: <span id="bio"></span></p>
    -->
    </body>
</html>
